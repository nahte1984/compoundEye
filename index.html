<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>compoundEye | v2.0</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none; /* 防止移動端預設滑動行為 */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background-color: #ffffff;
            transition: opacity 0.5s ease;
        }

        #start-btn {
            font-size: 18px;
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px solid #e0e0e0;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
        }

        #error-msg {
            display: none;
            color: #ff4d4f;
            text-align: center;
            padding: 20px;
            background: #fff0f0;
            border-radius: 10px;
            max-width: 80%;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <button id="start-btn">👀</button>
        <div id="error-msg">無法取得相機權限，請確認已允許存取。</div>
    </div>

    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline muted></video>

    <script>
        const startBtn = document.getElementById('start-btn');
        const uiLayer = document.getElementById('ui-layer');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');

        // 動畫與縮放狀態
        let animProgress = 1;
        let prevState = 0;
        let targetState = 0;
        
        let prevGridScale = 1;
        let targetGridScale = 1;
        let currentGridScale = 1;

        // 基礎八邊形網格設定 (baseR 為八邊形外接正方形的半徑)
        let baseR = 100;

        // Easing 函數 (easeInOutCubic) 讓動畫平滑
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        // 初始化 Canvas 大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 響應式：手機版縮小到 50%
            baseR = window.innerWidth < 768 ? 50 : 100;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 取得每個頂點的偏移量 (嚴格遵守內角 <= 180 度，最大偏移鎖定 25%)
        function getVertexOffset(idX, idY, state, baseRadius) {
            if (state === 0) return { x: 0, y: 0 };
            
            function hash(seedX, seedY, s, comp) {
                let h = Math.sin(seedX * 12.9898 + seedY * 78.233 + s * 37.719 + comp * 19.51) * 43758.5453;
                return h - Math.floor(h);
            }
            
            // 絕對安全的極限偏移值，保證多邊形永遠是凸的 (頂點不會交叉)
            const maxOffset = baseRadius * 0.25; 

            // 取一個抽象坐標系中的「引力中心」
            let focusX = hash(1, 1, state, 10) * window.innerWidth;
            let focusY = hash(1, 1, state, 11) * window.innerHeight;

            let dx = idX - focusX;
            let dy = idY - focusY;
            let dist = Math.hypot(dx, dy) + 0.001; 

            let dirX = dx / dist;
            let dirY = dy / dist;

            // 漣漪效應
            let wave = Math.cos((dist - baseRadius) / (2 * baseRadius) * Math.PI);

            // 加入微量雜訊
            let nx = hash(idX, idY, state, 1) * 2 - 1;
            let ny = hash(idX, idY, state, 2) * 2 - 1;

            let pushX = dirX * wave * 0.8 + nx * 0.2;
            let pushY = dirY * wave * 0.8 + ny * 0.2;

            let currentMag = Math.hypot(pushX, pushY) + 0.001;
            let scale = Math.min(currentMag, 1.0); 
            if (Math.abs(wave) > 0.5) scale = 1.0; 

            return { 
                x: (pushX / currentMag) * maxOffset * scale, 
                y: (pushY / currentMag) * maxOffset * scale 
            };
        }

        // 取得每個格子的內容屬性 (加入 typeOffset 區分八邊形與正方形的隨機內容)
        function getCellContent(col, row, state, typeOffset = 0) {
            function hash(c, r, s, comp) {
                let h = Math.sin((c + typeOffset) * 53.123 + (r + typeOffset) * 12.9898 + s * 78.233 + comp * 37.719) * 43758.5453;
                return h - Math.floor(h);
            }
            return {
                scale: 1 + hash(col, row, state, 1) * 6, // 縮放 1 ~ 7倍
                rx: hash(col, row, state, 2),          
                ry: hash(col, row, state, 3)           
            };
        }

        // 啟動相機
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } }
                });
                
                video.srcObject = stream;
                video.play();

                uiLayer.style.opacity = '0';
                setTimeout(() => { uiLayer.style.display = 'none'; }, 500);

                video.addEventListener('loadeddata', () => {
                    requestAnimationFrame(drawLoop);
                });

            } catch (err) {
                console.error("相機存取錯誤:", err);
                startBtn.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        });

        // 點擊變形與縮放
        canvas.addEventListener('click', () => {
            prevState = targetState;
            targetState++;
            
            prevGridScale = targetGridScale;
            // 面積隨機從 1 ~ 6 倍放大縮小 (半徑縮放比例為 √1 ~ √6)
            let targetAreaScale = 1 + Math.random() * 5; 
            targetGridScale = Math.sqrt(targetAreaScale);

            animProgress = 0; // 重置動畫進度
        });

        // 主要繪圖迴圈
        function drawLoop() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(drawLoop);
                return;
            }

            if (animProgress < 1) {
                animProgress += 0.02; 
                if (animProgress > 1) animProgress = 1;
            }
            
            let t = easeInOutCubic(animProgress);
            currentGridScale = prevGridScale + (targetGridScale - prevGridScale) * t;

            // 網格尺寸計算：以正方形網格 (S) 為基礎排列八邊形
            let S_current = 2 * baseR * currentGridScale;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const startCol = Math.floor((-S_current) / S_current) - 2;
            const endCol = Math.floor((canvas.width + S_current) / S_current) + 2;
            const startRow = Math.floor((-S_current) / S_current) - 2;
            const endRow = Math.floor((canvas.height + S_current) / S_current) + 2;

            // 雙重繪製：在每個網格點畫一個八邊形，以及網格縫隙的連接正方形
            for (let col = startCol; col <= endCol; col++) {
                for (let row = startRow; row <= endRow; row++) {
                    const cx_oct = col * S_current;
                    const cy_oct = row * S_current;
                    drawShape(col, row, 'octagon', cx_oct, cy_oct, t, currentGridScale, S_current);

                    const cx_sq = col * S_current + S_current / 2;
                    const cy_sq = row * S_current + S_current / 2;
                    drawShape(col, row, 'square', cx_sq, cy_sq, t, currentGridScale, S_current);
                }
            }

            requestAnimationFrame(drawLoop);
        }

        // 統一繪製多邊形的方法 (八邊形與正方形共用同一套變形力場)
        function drawShape(col, row, type, cx, cy, t, currentGridScale, S_current) {
            // 八邊形幾何常數 (Truncated Square Tiling)
            const r_current = S_current / (2 * (1 + Math.SQRT2));
            const R_curr = S_current / 2;
            const d = R_curr - r_current;

            let vertices = [];
            let typeOffset = 0; // 用於區分同座標的八邊形和正方形的隨機取樣內容

            if (type === 'octagon') {
                vertices = [
                    {x: cx + R_curr, y: cy + r_current},
                    {x: cx + r_current, y: cy + R_curr},
                    {x: cx - r_current, y: cy + R_curr},
                    {x: cx - R_curr, y: cy + r_current},
                    {x: cx - R_curr, y: cy - r_current},
                    {x: cx - r_current, y: cy - R_curr},
                    {x: cx + r_current, y: cy - R_curr},
                    {x: cx + R_curr, y: cy - r_current}
                ];
                typeOffset = 0;
            } else {
                vertices = [
                    {x: cx, y: cy - d},    // Top
                    {x: cx + d, y: cy},    // Right
                    {x: cx, y: cy + d},    // Bottom
                    {x: cx - d, y: cy}     // Left
                ];
                typeOffset = 0.5;
            }

            ctx.save();
            let maxDistX = 0;
            let maxDistY = 0;

            // 繪製路徑
            ctx.beginPath();
            for (let i = 0; i < vertices.length; i++) {
                const idealVx = vertices[i].x;
                const idealVy = vertices[i].y;

                // 產生不隨畫面縮放改變的純淨基準點，確保縮放時共用頂點不會破裂
                const baseS = baseR * 2;
                const base_r = baseS / (2 * (1 + Math.SQRT2));
                const base_R = baseS / 2;
                const base_d = base_R - base_r;

                const baseCx = col * baseS + (type === 'square' ? baseS / 2 : 0);
                const baseCy = row * baseS + (type === 'square' ? baseS / 2 : 0);

                let baseIdealVx, baseIdealVy;
                if (type === 'octagon') {
                    const base_oct_v = [
                        {x: baseCx + base_R, y: baseCy + base_r},
                        {x: baseCx + base_r, y: baseCy + base_R},
                        {x: baseCx - base_r, y: baseCy + base_R},
                        {x: baseCx - base_R, y: baseCy + base_r},
                        {x: baseCx - base_R, y: baseCy - base_r},
                        {x: baseCx - base_r, y: baseCy - base_R},
                        {x: baseCx + base_r, y: baseCy - base_R},
                        {x: baseCx + base_R, y: baseCy - base_r}
                    ];
                    baseIdealVx = base_oct_v[i].x;
                    baseIdealVy = base_oct_v[i].y;
                } else {
                    const base_sq_v = [
                        {x: baseCx, y: baseCy - base_d},
                        {x: baseCx + base_d, y: baseCy},
                        {x: baseCx, y: baseCy + base_d},
                        {x: baseCx - base_d, y: baseCy}
                    ];
                    baseIdealVx = base_sq_v[i].x;
                    baseIdealVy = base_sq_v[i].y;
                }

                const idX = Math.round(baseIdealVx);
                const idY = Math.round(baseIdealVy);

                // 補間變形
                const prevOff = getVertexOffset(idX, idY, prevState, baseR);
                const targetOff = getVertexOffset(idX, idY, targetState, baseR);
                const baseOffX = prevOff.x + (targetOff.x - prevOff.x) * t;
                const baseOffY = prevOff.y + (targetOff.y - prevOff.y) * t;

                const currentOffX = baseOffX * currentGridScale;
                const currentOffY = baseOffY * currentGridScale;

                let vx = idealVx + currentOffX;
                let vy = idealVy + currentOffY;

                maxDistX = Math.max(maxDistX, Math.abs(vx - cx));
                maxDistY = Math.max(maxDistY, Math.abs(vy - cy));

                // 擴張 1.0 像素修補反鋸齒白線
                let dx = vx - cx;
                let dy = vy - cy;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    vx += (dx / dist) * 1.0; 
                }

                if (i === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
            }
            ctx.closePath();
            ctx.clip(); 

            ctx.translate(cx, cy);

            const prevContent = getCellContent(col, row, prevState, typeOffset);
            const targetContent = getCellContent(col, row, targetState, typeOffset);
            
            const currentScale = prevContent.scale + (targetContent.scale - prevContent.scale) * t;
            const currentRx = prevContent.rx + (targetContent.rx - prevContent.rx) * t;
            const currentRy = prevContent.ry + (targetContent.ry - prevContent.ry) * t;

            const baseW = S_current;
            const baseH = S_current;
            const destW = Math.max(baseW * 1.8, maxDistX * 2.2);
            const destH = Math.max(baseH * 1.8, maxDistY * 2.2);
            const videoRatio = destW / destH;
            
            let maxSourceWidth = video.videoWidth;
            let maxSourceHeight = maxSourceWidth / videoRatio;

            if (maxSourceHeight > video.videoHeight) {
                maxSourceHeight = video.videoHeight;
                maxSourceWidth = maxSourceHeight * videoRatio;
            }

            const sw = maxSourceWidth / currentScale;
            const sh = maxSourceHeight / currentScale;

            const sx = currentRx * (video.videoWidth - sw);
            const sy = currentRy * (video.videoHeight - sh);

            ctx.drawImage(video, sx, sy, sw, sh, -destW/2, -destH/2, destW, destH);

            ctx.restore();
        }
    </script>
</body>
</html>
