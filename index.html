<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>compoundEye | v3.3.1</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background-color: #ffffff;
            transition: opacity 0.5s ease;
        }

        #start-btn {
            font-size: 18px;
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px solid #e0e0e0;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
        }

        #error-msg {
            display: none;
            color: #ff4d4f;
            text-align: center;
            padding: 20px;
            background: #fff0f0;
            border-radius: 10px;
            max-width: 80%;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <button id="start-btn">X_X</button>
        <div id="error-msg">無法取得相機權限，請確認已允許存取。</div>
    </div>

    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline muted></video>

    <script>
        const startBtn = document.getElementById('start-btn');
        const uiLayer = document.getElementById('ui-layer');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');

        let animProgress = 1;
        let prevState = 0;
        let targetState = 0;
        
        let prevGridScale = 1;
        let targetGridScale = 1;
        let currentGridScale = 1;

        let baseS = 180;

        const flashManager = {
            queue: [],
            active: null,
            flashDuration: 30,
            trigger: function(startCol, endCol, startRow, endRow) {
                this.queue = [];
                const numTriangles = Math.floor(Math.random() * 8) + 3;
                for (let i = 0; i < numTriangles; i++) {
                    const col = Math.floor(Math.random() * (endCol - startCol + 1)) + startCol;
                    const row = Math.floor(Math.random() * (endRow - startRow + 1)) + startRow;
                    const flashes = Math.floor(Math.random() * 3) + 1;
                    this.queue.push({ col, row, flashes });
                }
                this.next();
            },
            next: function() {
                if (this.queue.length > 0) {
                    const item = this.queue.shift();
                    this.active = {
                        col: item.col,
                        row: item.row,
                        targetFlashes: item.flashes,
                        currentFlash: 1,
                        isOn: true,
                        lastToggle: performance.now()
                    };
                } else {
                    this.active = null;
                }
            },
            update: function(time) {
                if (!this.active) return;
                if (time - this.active.lastToggle > this.flashDuration) {
                    this.active.isOn = !this.active.isOn;
                    this.active.lastToggle = time;
                    if (!this.active.isOn) {
                        if (this.active.currentFlash >= this.active.targetFlashes) {
                            this.next();
                        } else {
                            this.active.currentFlash++;
                        }
                    }
                }
            }
        };

        function triggerRandomFlashes() {
            let targetS = baseS * targetGridScale;
            let targetH = targetS * Math.sqrt(3) / 2;
            let colStep = targetS * 0.5;
            let startCol = Math.floor((canvas.width * 0.1) / colStep);
            let endCol = Math.ceil((canvas.width * 0.9) / colStep);
            let startRow = Math.floor((canvas.height * 0.1) / targetH);
            let endRow = Math.ceil((canvas.height * 0.9) / targetH);
            if (startCol > endCol) endCol = startCol;
            if (startRow > endRow) endRow = startRow;
            flashManager.trigger(startCol, endCol, startRow, endRow);
        }

        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            baseS = window.innerWidth < 768 ? 90 : 180;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getVertexOffset(idX, idY, state, baseSize) {
            if (state === 0) return { x: 0, y: 0 };
            function hash(seedX, seedY, s, comp) {
                let h = Math.sin(seedX * 12.9898 + seedY * 78.233 + s * 37.719 + comp * 19.51) * 43758.5453;
                return h - Math.floor(h);
            }
            const maxOffset = baseSize * 0.42;
            let focusX = hash(1, 1, state, 10) * window.innerWidth;
            let focusY = hash(1, 1, state, 11) * window.innerHeight;
            let dx = idX - focusX;
            let dy = idY - focusY;
            let dist = Math.hypot(dx, dy) + 0.001;
            let dirX = dx / dist;
            let dirY = dy / dist;
            let wave = Math.cos((dist - baseSize) / (2 * baseSize) * Math.PI);
            let nx = hash(idX, idY, state, 1) * 2 - 1;
            let ny = hash(idX, idY, state, 2) * 2 - 1;
            let pushX = dirX * wave * 0.8 + nx * 0.2;
            let pushY = dirY * wave * 0.8 + ny * 0.2;
            let currentMag = Math.hypot(pushX, pushY) + 0.001;
            let scale = Math.min(currentMag, 1.0);
            if (Math.abs(wave) > 0.5) scale = 1.0;
            return { x: (pushX / currentMag) * maxOffset * scale, y: (pushY / currentMag) * maxOffset * scale };
        }

        function getCellContent(col, row, state) {
            function hash(c, r, s, comp) {
                let h = Math.sin(c * 53.123 + r * 12.9898 + s * 78.233 + comp * 37.719) * 43758.5453;
                return h - Math.floor(h);
            }
            return {
                scale: 1 + hash(col, row, state, 1) * 6,
                rx: hash(col, row, state, 2),
                ry: hash(col, row, state, 3)
            };
        }

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                video.play();
                uiLayer.style.opacity = '0';
                setTimeout(() => { uiLayer.style.display = 'none'; }, 500);
                
                video.addEventListener('loadeddata', () => { 
                    // 在影片載入後，直接觸發第一次變形
                    prevState = 0;
                    targetState = 1;
                    prevGridScale = 1;
                    
                    let areaScale = 0.5 + Math.random() * 11.5;
                    targetGridScale = Math.sqrt(areaScale);
                    
                    animProgress = 0; // 重置進度以觸發 Easing
                    
                    requestAnimationFrame(drawLoop); 
                });
            } catch (err) {
                console.error("相機存取錯誤:", err);
                startBtn.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        });

        canvas.addEventListener('click', () => {
            prevState = targetState;
            targetState++;
            prevGridScale = targetGridScale;
            
            let areaScale = 0.5 + Math.random() * 11.5;
            targetGridScale = Math.sqrt(areaScale);
            
            animProgress = 0;
            triggerRandomFlashes();
        });

        function drawLoop() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(drawLoop);
                return;
            }
            flashManager.update(performance.now());
            if (animProgress < 1) {
                animProgress += 0.03;
                if (animProgress > 1) animProgress = 1;
            }
            let t = easeInOutCubic(animProgress);
            currentGridScale = prevGridScale + (targetGridScale - prevGridScale) * t;
            let S_current = baseS * currentGridScale;
            let H_current = S_current * Math.sqrt(3) / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const colStep = S_current * 0.5;
            const startCol = Math.floor(-S_current / colStep) - 2;
            const endCol = Math.ceil((canvas.width + S_current) / colStep) + 2;
            const startRow = Math.floor(-H_current / H_current) - 2;
            const endRow = Math.ceil((canvas.height + H_current) / H_current) + 2;
            for (let col = startCol; col <= endCol; col++) {
                for (let row = startRow; row <= endRow; row++) {
                    drawTriangle(col, row, t, currentGridScale, S_current, H_current);
                }
            }
            requestAnimationFrame(drawLoop);
        }

        function drawTriangle(col, row, t, currentGridScale, S_current, H_current) {
            const isUp = Math.abs(col + row) % 2 === 0;
            let vertices = [];
            let baseVertices = [];
            const baseH = baseS * Math.sqrt(3) / 2;
            if (isUp) {
                vertices = [{x: col * 0.5 * S_current, y: row * H_current}, {x: (col + 1) * 0.5 * S_current, y: (row + 1) * H_current}, {x: (col - 1) * 0.5 * S_current, y: (row + 1) * H_current}];
                baseVertices = [{x: col * 0.5 * baseS, y: row * baseH}, {x: (col + 1) * 0.5 * baseS, y: (row + 1) * baseH}, {x: (col - 1) * 0.5 * baseS, y: (row + 1) * baseH}];
            } else {
                vertices = [{x: (col - 1) * 0.5 * S_current, y: row * H_current}, {x: (col + 1) * 0.5 * S_current, y: row * H_current}, {x: col * 0.5 * S_current, y: (row + 1) * H_current}];
                baseVertices = [{x: (col - 1) * 0.5 * baseS, y: row * baseH}, {x: (col + 1) * 0.5 * baseS, y: row * baseH}, {x: col * 0.5 * baseS, y: (row + 1) * baseH}];
            }
            const cx = col * 0.5 * S_current;
            const cy = row * H_current + (isUp ? H_current * (2/3) : H_current * (1/3));
            ctx.save();
            let maxDistX = 0; let maxDistY = 0;
            ctx.beginPath();
            for (let i = 0; i < vertices.length; i++) {
                const idealVx = vertices[i].x; const idealVy = vertices[i].y;
                const idX = Math.round(baseVertices[i].x); const idY = Math.round(baseVertices[i].y);
                const prevOff = getVertexOffset(idX, idY, prevState, baseS);
                const targetOff = getVertexOffset(idX, idY, targetState, baseS);
                const baseOffX = prevOff.x + (targetOff.x - prevOff.x) * t;
                const baseOffY = prevOff.y + (targetOff.y - prevOff.y) * t;
                let vx = idealVx + baseOffX * currentGridScale;
                let vy = idealVy + baseOffY * currentGridScale;
                maxDistX = Math.max(maxDistX, Math.abs(vx - cx)); maxDistY = Math.max(maxDistY, Math.abs(vy - cy));
                
                let dx = vx - cx; let dy = vy - cy;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) { 
                    // 修正：同時對 X 軸與 Y 軸進行 1.5px 的外擴
                    vx += (dx / dist) * 1.5; 
                    vy += (dy / dist) * 1.5; 
                }
                
                if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
            }
            ctx.closePath(); ctx.clip(); ctx.translate(cx, cy);
            
            const prevContent = getCellContent(col, row, prevState);
            const targetContent = getCellContent(col, row, targetState);
            const currentScale = prevContent.scale + (targetContent.scale - prevContent.scale) * t;
            const currentRx = prevContent.rx + (targetContent.rx - prevContent.rx) * t;
            const currentRy = prevContent.ry + (targetContent.ry - prevContent.ry) * t;
            
            // 修正：加上 3px 的 padding (每邊 1.5px) 以覆蓋擴張後的影像範圍
            const padding = 3;
            const destW = Math.max(S_current * 2.0, maxDistX * 2.2) + padding;
            const destH = Math.max(H_current * 2.0, maxDistY * 2.2) + padding;
            const videoRatio = destW / destH;
            
            let maxSourceWidth = video.videoWidth;
            let maxSourceHeight = maxSourceWidth / videoRatio;
            if (maxSourceHeight > video.videoHeight) { maxSourceHeight = video.videoHeight; maxSourceWidth = maxSourceHeight * videoRatio; }
            
            ctx.drawImage(video, currentRx * (video.videoWidth - maxSourceWidth / currentScale), currentRy * (video.videoHeight - maxSourceHeight / currentScale), maxSourceWidth / currentScale, maxSourceHeight / currentScale, -destW/2, -destH/2, destW, destH);
            if (flashManager.active && flashManager.active.col === col && flashManager.active.row === row && flashManager.active.isOn) {
                ctx.fillStyle = '#ffffff'; ctx.fillRect(-destW/2, -destH/2, destW, destH);
            }
            ctx.restore();
        }
    </script>
</body>
</html>
