<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>compoundEye | v1.3</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none; /* 防止移動端預設滑動行為 */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background-color: #ffffff;
            transition: opacity 0.5s ease;
        }

        #start-btn {
            font-size: 18px;
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px solid #e0e0e0;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
        }

        #error-msg {
            display: none;
            color: #ff4d4f;
            text-align: center;
            padding: 20px;
            background: #fff0f0;
            border-radius: 10px;
            max-width: 80%;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <button id="start-btn">👀</button>
        <div id="error-msg">無法取得相機權限，請確認已允許存取。</div>
    </div>

    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline muted></video>

    <script>
        const startBtn = document.getElementById('start-btn');
        const uiLayer = document.getElementById('ui-layer');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');

        // 動畫狀態
        let animProgress = 1;
        let prevState = 0;
        let targetState = 0;

        // 正六邊形設定 (動態響應式)
        let R = 100; 
        let W = 2 * R; // 200
        let H = Math.sqrt(3) * R; // 約 173.2

        // 網格間距
        let xOffset = 1.5 * R;
        let yOffset = H;

        // Easing 函數 (easeInOutCubic) 讓動畫平滑
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        // 初始化 Canvas 大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 響應式：手機版 (寬度小於 768px) 六邊形縮小到 50% (R = 50)
            R = window.innerWidth < 768 ? 50 : 100;
            W = 2 * R;
            H = Math.sqrt(3) * R;
            xOffset = 1.5 * R;
            yOffset = H;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 取得每個頂點的偏移量 (嚴格遵守內角 <= 180 度，最大偏移鎖定 25%)
        function getVertexOffset(idX, idY, state) {
            if (state === 0) return { x: 0, y: 0 };
            
            function hash(seedX, seedY, s, comp) {
                let h = Math.sin(seedX * 12.9898 + seedY * 78.233 + s * 37.719 + comp * 19.51) * 43758.5453;
                return h - Math.floor(h);
            }
            
            // 絕對安全的極限偏移值，保證多邊形永遠是凸的
            const maxOffset = R * 0.25; 

            // 取畫面中一個隨機的「引力中心」
            let focusX = hash(1, 1, state, 10) * window.innerWidth;
            let focusY = hash(1, 1, state, 11) * window.innerHeight;

            let dx = idX - focusX;
            let dy = idY - focusY;
            let dist = Math.hypot(dx, dy) + 0.001; // 避免除以零

            // 取得由中心向外的放射狀方向
            let dirX = dx / dist;
            let dirY = dy / dist;

            // 利用 cos 函數製造「漣漪效應」，將相鄰的格子推向極端的放大與縮小
            // dist = R 時 (中心格的頂點)：cos(0) = 1 (往外擴張)
            // dist = 3R 時 (外圍格的頂點)：cos(PI) = -1 (往內收縮)
            let wave = Math.cos((dist - R) / (2 * R) * Math.PI);

            // 加入微量雜訊，讓變形保有些微有機的感覺
            let nx = hash(idX, idY, state, 1) * 2 - 1;
            let ny = hash(idX, idY, state, 2) * 2 - 1;

            // 混合波浪與雜訊 (80% 由波浪主導張力)
            let pushX = dirX * wave * 0.8 + nx * 0.2;
            let pushY = dirY * wave * 0.8 + ny * 0.2;

            // 計算最終推力長度並標準化
            let currentMag = Math.hypot(pushX, pushY) + 0.001;
            
            // 強迫波峰與波谷的頂點「推到數學上的極限位置」(乘上 maxOffset)
            // 這樣可以保證畫面中一定會出現數學允許的「最大細胞」與「最小細胞」
            let scale = Math.min(currentMag, 1.0); 
            if (Math.abs(wave) > 0.5) scale = 1.0; // 強化極端值的擴張力道

            return { 
                x: (pushX / currentMag) * maxOffset * scale, 
                y: (pushY / currentMag) * maxOffset * scale 
            };
        }

        // 取得每個格子的內容屬性 (縮放倍率、取樣位置X比例、取樣位置Y比例)
        function getCellContent(col, row, state) {
            function hash(c, r, s, comp) {
                let h = Math.sin(c * 53.123 + r * 12.9898 + s * 78.233 + comp * 37.719) * 43758.5453;
                return h - Math.floor(h);
            }
            
            return {
                scale: 1 + hash(col, row, state, 1) * 6, // 縮放 1 ~ 7倍
                rx: hash(col, row, state, 2),          
                ry: hash(col, row, state, 3)           
            };
        }

        // 啟動相機
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } }
                });
                
                video.srcObject = stream;
                video.play();

                uiLayer.style.opacity = '0';
                setTimeout(() => { uiLayer.style.display = 'none'; }, 500);

                video.addEventListener('loadeddata', () => {
                    requestAnimationFrame(drawLoop);
                });

            } catch (err) {
                console.error("相機存取錯誤:", err);
                startBtn.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        });

        // 點擊畫面任意處隨機偏移網格
        canvas.addEventListener('click', () => {
            prevState = targetState;
            targetState++;
            animProgress = 0; // 重置動畫進度，觸發 easing
        });

        // 主要繪圖迴圈
        function drawLoop() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(drawLoop);
                return;
            }

            // 更新動畫進度
            if (animProgress < 1) {
                animProgress += 0.02; // 控制動畫速度
                if (animProgress > 1) animProgress = 1;
            }
            
            let t = easeInOutCubic(animProgress);

            // 清空畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 計算可見網格範圍 (恢復正常的邊緣緩衝量)
            const startCol = Math.floor((-W) / xOffset) - 2;
            const endCol = Math.floor((canvas.width + W) / xOffset) + 2;
            const startRow = Math.floor((-H) / yOffset) - 2;
            const endRow = Math.floor((canvas.height + H) / yOffset) + 2;

            // 繪製每一個可見的六邊形
            for (let col = startCol; col <= endCol; col++) {
                for (let row = startRow; row <= endRow; row++) {
                    drawCell(col, row, t);
                }
            }

            requestAnimationFrame(drawLoop);
        }

        function drawCell(col, row, t) {
            const isOddCol = Math.abs(col % 2) === 1;
            const cx_actual = col * xOffset;
            const cy_actual = row * yOffset + (isOddCol ? H / 2 : 0);

            ctx.save();

            let maxDistX = 0;
            let maxDistY = 0;

            // 1. 繪製變形六邊形路徑並設定為剪裁範圍
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = i * Math.PI / 3; 
                // 網格理想基準座標
                const idealVx = col * xOffset + R * Math.cos(angle);
                const idealVy = row * yOffset + (isOddCol ? H / 2 : 0) + R * Math.sin(angle);
                
                // 利用四捨五入取得該頂點的唯一 ID
                const idX = Math.round(idealVx);
                const idY = Math.round(idealVy);
                
                // 取得前後狀態的頂點偏移量並進行 Interpolation (補間)
                const prevOff = getVertexOffset(idX, idY, prevState);
                const targetOff = getVertexOffset(idX, idY, targetState);
                const currentOffX = prevOff.x + (targetOff.x - prevOff.x) * t;
                const currentOffY = prevOff.y + (targetOff.y - prevOff.y) * t;
                
                // 計算最終頂點實際座標
                let vx = idealVx + currentOffX;
                let vy = idealVy + currentOffY;

                maxDistX = Math.max(maxDistX, Math.abs(vx - cx_actual));
                maxDistY = Math.max(maxDistY, Math.abs(vy - cy_actual));

                // 修正 sub-pixel 產生的細線：將頂點沿著法向量向外微幅擴張
                let dx = vx - cx_actual;
                let dy = vy - cy_actual;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    vx += (dx / dist) * 1.0; 
                }

                if (i === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
            }
            ctx.closePath();
            ctx.clip(); 

            // 移動畫布中心到此格
            ctx.translate(cx_actual, cy_actual);

            // 取得前後狀態的內容參數並進行 Interpolation
            const prevContent = getCellContent(col, row, prevState);
            const targetContent = getCellContent(col, row, targetState);
            
            const currentScale = prevContent.scale + (targetContent.scale - prevContent.scale) * t;
            const currentRx = prevContent.rx + (targetContent.rx - prevContent.rx) * t;
            const currentRy = prevContent.ry + (targetContent.ry - prevContent.ry) * t;

            // 2. 計算影片來源裁切尺寸 
            const destW = Math.max(W * 1.8, maxDistX * 2.2);
            const destH = Math.max(H * 1.8, maxDistY * 2.2);
            const videoRatio = destW / destH;
            
            let maxSourceWidth = video.videoWidth;
            let maxSourceHeight = maxSourceWidth / videoRatio;

            if (maxSourceHeight > video.videoHeight) {
                maxSourceHeight = video.videoHeight;
                maxSourceWidth = maxSourceHeight * videoRatio;
            }

            const sw = maxSourceWidth / currentScale;
            const sh = maxSourceHeight / currentScale;

            const sx = currentRx * (video.videoWidth - sw);
            const sy = currentRy * (video.videoHeight - sh);

            // 3. 繪製影像
            ctx.drawImage(video, sx, sy, sw, sh, -destW/2, -destH/2, destW, destH);

            ctx.restore();
        }
    </script>
</body>
</html>
