<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>compoundEye | v1.4</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none; /* 防止移動端預設滑動行為 */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background-color: #ffffff;
            transition: opacity 0.5s ease;
        }

        #start-btn {
            font-size: 18px;
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px solid #e0e0e0;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
        }

        #error-msg {
            display: none;
            color: #ff4d4f;
            text-align: center;
            padding: 20px;
            background: #fff0f0;
            border-radius: 10px;
            max-width: 80%;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <button id="start-btn">👀</button>
        <div id="error-msg">無法取得相機權限，請確認已允許存取。</div>
    </div>

    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline muted></video>

    <script>
        const startBtn = document.getElementById('start-btn');
        const uiLayer = document.getElementById('ui-layer');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');

        // 動畫與縮放狀態
        let animProgress = 1;
        let prevState = 0;
        let targetState = 0;
        
        let prevGridScale = 1;
        let targetGridScale = 1;
        let currentGridScale = 1;

        // 基礎正六邊形設定 (改為基礎變數，後續會隨縮放倍率動態改變)
        let baseR = 100;

        // Easing 函數 (easeInOutCubic) 讓動畫平滑
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        // 初始化 Canvas 大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 響應式：手機版 (寬度小於 768px) 基準六邊形縮小到 50%
            baseR = window.innerWidth < 768 ? 50 : 100;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 取得每個頂點的偏移量 (嚴格遵守內角 <= 180 度，最大偏移鎖定 25%)
        function getVertexOffset(idX, idY, state, baseRadius) {
            if (state === 0) return { x: 0, y: 0 };
            
            function hash(seedX, seedY, s, comp) {
                let h = Math.sin(seedX * 12.9898 + seedY * 78.233 + s * 37.719 + comp * 19.51) * 43758.5453;
                return h - Math.floor(h);
            }
            
            // 絕對安全的極限偏移值，保證多邊形永遠是凸的
            const maxOffset = baseRadius * 0.25; 

            // 取一個抽象坐標系中的「引力中心」
            let focusX = hash(1, 1, state, 10) * 2000;
            let focusY = hash(1, 1, state, 11) * 2000;

            let dx = idX - focusX;
            let dy = idY - focusY;
            let dist = Math.hypot(dx, dy) + 0.001; 

            // 取得由中心向外的放射狀方向
            let dirX = dx / dist;
            let dirY = dy / dist;

            // 利用 cos 函數製造「漣漪效應」
            let wave = Math.cos((dist - baseRadius) / (2 * baseRadius) * Math.PI);

            // 加入微量雜訊
            let nx = hash(idX, idY, state, 1) * 2 - 1;
            let ny = hash(idX, idY, state, 2) * 2 - 1;

            // 混合波浪與雜訊 
            let pushX = dirX * wave * 0.8 + nx * 0.2;
            let pushY = dirY * wave * 0.8 + ny * 0.2;

            let currentMag = Math.hypot(pushX, pushY) + 0.001;
            
            let scale = Math.min(currentMag, 1.0); 
            if (Math.abs(wave) > 0.5) scale = 1.0; 

            return { 
                x: (pushX / currentMag) * maxOffset * scale, 
                y: (pushY / currentMag) * maxOffset * scale 
            };
        }

        // 取得每個格子的內容屬性 (縮放倍率、取樣位置X比例、取樣位置Y比例)
        function getCellContent(col, row, state) {
            function hash(c, r, s, comp) {
                let h = Math.sin(c * 53.123 + r * 12.9898 + s * 78.233 + comp * 37.719) * 43758.5453;
                return h - Math.floor(h);
            }
            
            return {
                scale: 1 + hash(col, row, state, 1) * 6, // 縮放 1 ~ 7倍
                rx: hash(col, row, state, 2),          
                ry: hash(col, row, state, 3)           
            };
        }

        // 啟動相機
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } }
                });
                
                video.srcObject = stream;
                video.play();

                uiLayer.style.opacity = '0';
                setTimeout(() => { uiLayer.style.display = 'none'; }, 500);

                video.addEventListener('loadeddata', () => {
                    requestAnimationFrame(drawLoop);
                });

            } catch (err) {
                console.error("相機存取錯誤:", err);
                startBtn.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        });

        // 點擊畫面任意處隨機偏移網格，並隨機巨幅改變畫面網格縮放
        canvas.addEventListener('click', () => {
            prevState = targetState;
            targetState++;
            
            prevGridScale = targetGridScale;
            // 要求：面積隨機從 1 ~ 6 倍放大縮小。
            // 數學換算：面積 = 半徑的平方，所以半徑縮放比例為 √1 ~ √6
            let targetAreaScale = 1 + Math.random() * 5; 
            targetGridScale = Math.sqrt(targetAreaScale);

            animProgress = 0; // 重置動畫進度，觸發 easing
        });

        // 主要繪圖迴圈
        function drawLoop() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(drawLoop);
                return;
            }

            // 更新動畫進度
            if (animProgress < 1) {
                animProgress += 0.02; 
                if (animProgress > 1) animProgress = 1;
            }
            
            let t = easeInOutCubic(animProgress);

            // 計算當前的動態縮放比例
            currentGridScale = prevGridScale + (targetGridScale - prevGridScale) * t;

            // 尖角在上的六邊形尺寸計算 (套用動態縮放)
            // 尖角在上的網格特性：寬度為 √3 * R，高度為 2 * R
            let R_current = baseR * currentGridScale;
            let W_current = Math.sqrt(3) * R_current;
            let H_current = 2 * R_current;
            let xOffset = W_current;
            let yOffset = 1.5 * R_current;

            // 清空畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 計算可見網格範圍 (尖角在上模式)
            const startCol = Math.floor((-W_current) / xOffset) - 2;
            const endCol = Math.floor((canvas.width + W_current) / xOffset) + 2;
            const startRow = Math.floor((-H_current) / yOffset) - 2;
            const endRow = Math.floor((canvas.height + H_current) / yOffset) + 2;

            // 繪製每一個可見的六邊形
            for (let col = startCol; col <= endCol; col++) {
                for (let row = startRow; row <= endRow; row++) {
                    drawCell(col, row, t, R_current, W_current, H_current, xOffset, yOffset);
                }
            }

            requestAnimationFrame(drawLoop);
        }

        function drawCell(col, row, t, R_current, W_current, H_current, xOffset, yOffset) {
            // 尖角在上的六邊形，奇數「列 (row)」要向右偏移半格
            const isOddRow = Math.abs(row % 2) === 1;
            
            // 基礎無縮放的理想座標 (用於產生穩定且不隨縮放改變的頂點 Hash ID)
            const baseW = Math.sqrt(3) * baseR;
            const baseXOffset = baseW;
            const baseYOffset = 1.5 * baseR;
            const baseCx = col * baseXOffset + (isOddRow ? baseXOffset / 2 : 0);
            const baseCy = row * baseYOffset;

            // 當前實際繪製的中心座標 (包含縮放偏移)
            const cx_actual = col * xOffset + (isOddRow ? xOffset / 2 : 0);
            const cy_actual = row * yOffset;

            ctx.save();

            let maxDistX = 0;
            let maxDistY = 0;

            // 1. 繪製變形六邊形路徑並設定為剪裁範圍
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                // 尖角在上的頂點角度 (-90度起算：-90, -30, 30, 90, 150, 210)
                const angle = -Math.PI / 2 + i * Math.PI / 3; 
                
                // 用無縮放的座標產生唯一頂點 ID
                const baseVx = baseCx + baseR * Math.cos(angle);
                const baseVy = baseCy + baseR * Math.sin(angle);
                const idX = Math.round(baseVx);
                const idY = Math.round(baseVy);
                
                // 取得基礎偏移量 (保證凸多邊形的極限 25%)
                const prevOff = getVertexOffset(idX, idY, prevState, baseR);
                const targetOff = getVertexOffset(idX, idY, targetState, baseR);
                const baseOffX = prevOff.x + (targetOff.x - prevOff.x) * t;
                const baseOffY = prevOff.y + (targetOff.y - prevOff.y) * t;
                
                // 將極限偏移量乘上當前的整體網格縮放比例，確保縮放時比例不失真
                const currentOffX = baseOffX * currentGridScale;
                const currentOffY = baseOffY * currentGridScale;

                // 計算最終頂點實際螢幕座標
                const idealVx = cx_actual + R_current * Math.cos(angle);
                const idealVy = cy_actual + R_current * Math.sin(angle);
                let vx = idealVx + currentOffX;
                let vy = idealVy + currentOffY;

                maxDistX = Math.max(maxDistX, Math.abs(vx - cx_actual));
                maxDistY = Math.max(maxDistY, Math.abs(vy - cy_actual));

                // 修正 sub-pixel 產生的細線：將頂點沿著法向量向外微幅擴張
                let dx = vx - cx_actual;
                let dy = vy - cy_actual;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    vx += (dx / dist) * 1.0; 
                }

                if (i === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
            }
            ctx.closePath();
            ctx.clip(); 

            // 移動畫布中心到此格
            ctx.translate(cx_actual, cy_actual);

            // 取得前後狀態的內容參數並進行 Interpolation
            const prevContent = getCellContent(col, row, prevState);
            const targetContent = getCellContent(col, row, targetState);
            
            const currentScale = prevContent.scale + (targetContent.scale - prevContent.scale) * t;
            const currentRx = prevContent.rx + (targetContent.rx - prevContent.rx) * t;
            const currentRy = prevContent.ry + (targetContent.ry - prevContent.ry) * t;

            // 2. 計算影片來源裁切尺寸 
            const destW = Math.max(W_current * 1.8, maxDistX * 2.2);
            const destH = Math.max(H_current * 1.8, maxDistY * 2.2);
            const videoRatio = destW / destH;
            
            let maxSourceWidth = video.videoWidth;
            let maxSourceHeight = maxSourceWidth / videoRatio;

            if (maxSourceHeight > video.videoHeight) {
                maxSourceHeight = video.videoHeight;
                maxSourceWidth = maxSourceHeight * videoRatio;
            }

            const sw = maxSourceWidth / currentScale;
            const sh = maxSourceHeight / currentScale;

            const sx = currentRx * (video.videoWidth - sw);
            const sy = currentRy * (video.videoHeight - sh);

            // 3. 繪製影像
            ctx.drawImage(video, sx, sy, sw, sh, -destW/2, -destH/2, destW, destH);

            ctx.restore();
        }
    </script>
</body>
</html>
