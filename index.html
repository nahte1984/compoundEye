<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>compoundEye | v1.2</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none; /* 防止移動端預設滑動行為 */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background-color: #ffffff;
            transition: opacity 0.5s ease;
        }

        #start-btn {
            font-size: 18px;
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px solid #e0e0e0;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
        }

        #error-msg {
            display: none;
            color: #ff4d4f;
            text-align: center;
            padding: 20px;
            background: #fff0f0;
            border-radius: 10px;
            max-width: 80%;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <button id="start-btn">👀</button>
        <div id="error-msg">無法取得相機權限，請確認已允許存取。</div>
    </div>

    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline muted></video>

    <script>
        const startBtn = document.getElementById('start-btn');
        const uiLayer = document.getElementById('ui-layer');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');

        // 動畫狀態
        let animProgress = 1;
        let prevState = 0;
        let targetState = 0;

        // 正六邊形設定 (動態響應式)
        let R = 100; 
        let W = 2 * R; // 200
        let H = Math.sqrt(3) * R; // 約 173.2

        // 網格間距
        let xOffset = 1.5 * R;
        let yOffset = H;

        // Easing 函數 (easeInOutCubic) 讓動畫平滑
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        // 初始化 Canvas 大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 響應式：手機版 (寬度小於 768px) 六邊形縮小到 50% (R = 50)
            R = window.innerWidth < 768 ? 50 : 100;
            W = 2 * R;
            H = Math.sqrt(3) * R;
            xOffset = 1.5 * R;
            yOffset = H;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 取得每個頂點的隨機偏移量，加入「力場推擠」製造極端巨大的六邊形
        function getVertexOffset(idX, idY, state) {
            if (state === 0) return { x: 0, y: 0 };
            
            // 利用座標與狀態產生隨機種子
            function hash(seedX, seedY, s, comp) {
                let h = Math.sin(seedX * 12.9898 + seedY * 78.233 + s * 37.719 + comp * 19.51) * 43758.5453;
                return h - Math.floor(h);
            }
            
            // 1. 基礎的局部碎裂變形 (保留有機感)
            const baseMaxOffset = R * 0.4; 
            let rx = hash(idX, idY, state, 1) * 2 - 1;
            let ry = hash(idX, idY, state, 2) * 2 - 1;
            let baseX = rx * baseMaxOffset;
            let baseY = ry * baseMaxOffset;

            // 2. 超巨大力場排斥 (Focal Push) - 製造巨大的視覺張力
            let giantX = 0;
            let giantY = 0;

            // 力場 1：超級巨大的主要張力點 (製造超過畫面一半的六邊形)
            let f1x = hash(1, 1, state, 10) * window.innerWidth;
            let f1y = hash(1, 1, state, 11) * window.innerHeight;
            let d1 = Math.hypot(idX - f1x, idY - f1y) + 0.001; // 避免除以零
            
            // 最大推擠距離設定為螢幕長邊的 60%，強制拉扯中心點的網格
            let maxPush1 = Math.max(window.innerWidth, window.innerHeight) * 0.6; 
            let pushRadius1 = maxPush1 * 1.5; 
            
            // 使用二次方衰減曲線，距離力場中心越近，向外的推力越強大
            let pushFactor1 = Math.pow(Math.max(0, 1 - d1 / pushRadius1), 2);
            giantX += ((idX - f1x) / d1) * maxPush1 * pushFactor1;
            giantY += ((idY - f1y) / d1) * maxPush1 * pushFactor1;

            // 力場 2：次要的張力點，增加不對稱與被擠壓的星狀碎裂感
            let f2x = hash(2, 2, state, 12) * window.innerWidth;
            let f2y = hash(2, 2, state, 13) * window.innerHeight;
            let d2 = Math.hypot(idX - f2x, idY - f2y) + 0.001;
            let maxPush2 = Math.max(window.innerWidth, window.innerHeight) * 0.3;
            let pushRadius2 = maxPush2 * 1.5;
            let pushFactor2 = Math.pow(Math.max(0, 1 - d2 / pushRadius2), 2);
            
            giantX += ((idX - f2x) / d2) * maxPush2 * pushFactor2;
            giantY += ((idY - f2y) / d2) * maxPush2 * pushFactor2;
            
            // 解除內角不可大於 180 度的限制：允許頂點大範圍交錯、重疊與翻轉
            return { x: baseX + giantX, y: baseY + giantY };
        }

        // 取得每個格子的內容屬性 (縮放倍率、取樣位置X比例、取樣位置Y比例)
        function getCellContent(col, row, state) {
            function hash(c, r, s, comp) {
                // 使用不同的常數來產生獨立的雜湊值
                let h = Math.sin(c * 53.123 + r * 12.9898 + s * 78.233 + comp * 37.719) * 43758.5453;
                return h - Math.floor(h);
            }
            
            return {
                scale: 1 + hash(col, row, state, 1) * 6, // 縮放 1 ~ 7倍
                rx: hash(col, row, state, 2),          // X軸取樣起點 0 ~ 1 比例
                ry: hash(col, row, state, 3)           // Y軸取樣起點 0 ~ 1 比例
            };
        }

        // 啟動相機
        startBtn.addEventListener('click', async () => {
            try {
                // 請求後鏡頭 (environment)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } }
                });
                
                video.srcObject = stream;
                video.play();

                // 隱藏 UI，開始繪製
                uiLayer.style.opacity = '0';
                setTimeout(() => { uiLayer.style.display = 'none'; }, 500);

                // 當影像資料足夠時開始動畫迴圈
                video.addEventListener('loadeddata', () => {
                    requestAnimationFrame(drawLoop);
                });

            } catch (err) {
                console.error("相機存取錯誤:", err);
                startBtn.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        });

        // 點擊畫面任意處隨機偏移網格，並增加狀態以改變頂點形狀
        canvas.addEventListener('click', () => {
            prevState = targetState;
            targetState++;
            
            // 移除全域偏移量改變，讓六邊形在原地進行造型改變，取消平移效果
            
            animProgress = 0; // 重置動畫進度，觸發 easing
        });

        // 主要繪圖迴圈
        function drawLoop() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(drawLoop);
                return;
            }

            // 更新動畫進度
            if (animProgress < 1) {
                animProgress += 0.02; // 控制動畫速度
                if (animProgress > 1) animProgress = 1;
            }
            
            let t = easeInOutCubic(animProgress);

            // 清空畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 因為力場推擠的範圍可能超過 800px，我們必須大幅擴張「可見網格範圍」，否則畫面邊緣會破圖
            let maxTotalPush = Math.max(window.innerWidth, window.innerHeight) * 0.9;
            let padCols = Math.ceil(maxTotalPush / xOffset) + 1;
            let padRows = Math.ceil(maxTotalPush / yOffset) + 1;

            const startCol = Math.floor((-W) / xOffset) - padCols;
            const endCol = Math.floor((canvas.width + W) / xOffset) + padCols;
            const startRow = Math.floor((-H) / yOffset) - padRows;
            const endRow = Math.floor((canvas.height + H) / yOffset) + padRows;

            // 繪製每一個可見的六邊形
            for (let col = startCol; col <= endCol; col++) {
                for (let row = startRow; row <= endRow; row++) {
                    drawCell(col, row, t);
                }
            }

            requestAnimationFrame(drawLoop);
        }

        function drawCell(col, row, t) {
            const isOddCol = Math.abs(col % 2) === 1;
            const cx_actual = col * xOffset;
            const cy_actual = row * yOffset + (isOddCol ? H / 2 : 0);

            ctx.save();

            let maxDistX = 0;
            let maxDistY = 0;

            // 1. 繪製變形六邊形路徑並設定為剪裁範圍
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = i * Math.PI / 3; 
                // 網格理想基準座標
                const idealVx = col * xOffset + R * Math.cos(angle);
                const idealVy = row * yOffset + (isOddCol ? H / 2 : 0) + R * Math.sin(angle);
                
                // 利用四捨五入取得該頂點的唯一 ID
                const idX = Math.round(idealVx);
                const idY = Math.round(idealVy);
                
                // 取得前後狀態的頂點偏移量並進行 Interpolation (補間)
                const prevOff = getVertexOffset(idX, idY, prevState);
                const targetOff = getVertexOffset(idX, idY, targetState);
                const currentOffX = prevOff.x + (targetOff.x - prevOff.x) * t;
                const currentOffY = prevOff.y + (targetOff.y - prevOff.y) * t;
                
                // 計算最終頂點實際座標
                let vx = idealVx + currentOffX;
                let vy = idealVy + currentOffY;

                // 記錄頂點偏離網格中心的極端距離，用來計算影像需要的裁切範圍
                maxDistX = Math.max(maxDistX, Math.abs(vx - cx_actual));
                maxDistY = Math.max(maxDistY, Math.abs(vy - cy_actual));

                // 修正 sub-pixel 產生的細線：將頂點沿著法向量向外微幅擴張 (Overlap)
                let dx = vx - cx_actual;
                let dy = vy - cy_actual;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    vx += (dx / dist) * 1.0; 
                }

                if (i === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
            }
            ctx.closePath();
            ctx.clip(); 

            // 移動畫布中心到此格，以便繪製影像
            ctx.translate(cx_actual, cy_actual);

            // 取得前後狀態的內容參數並進行 Interpolation (補間)
            const prevContent = getCellContent(col, row, prevState);
            const targetContent = getCellContent(col, row, targetState);
            
            // 將畫面的 縮放 以及 裁切座標 進行平滑的 Easing 動畫運算
            const currentScale = prevContent.scale + (targetContent.scale - prevContent.scale) * t;
            const currentRx = prevContent.rx + (targetContent.rx - prevContent.rx) * t;
            const currentRy = prevContent.ry + (targetContent.ry - prevContent.ry) * t;

            // 2. 計算影片來源裁切尺寸 
            // 動態根據頂點被拉扯的極端距離 (maxDistX/Y) 來放大影像繪製範圍
            // 這樣超級巨大的六邊形內部影像才不會出現被切斷的空白邊緣
            const destW = Math.max(W * 1.8, maxDistX * 2.2);
            const destH = Math.max(H * 1.8, maxDistY * 2.2);
            const videoRatio = destW / destH;
            
            let maxSourceWidth = video.videoWidth;
            let maxSourceHeight = maxSourceWidth / videoRatio;

            if (maxSourceHeight > video.videoHeight) {
                maxSourceHeight = video.videoHeight;
                maxSourceWidth = maxSourceHeight * videoRatio;
            }

            // 根據動態補間的縮放比例，決定要取樣的區塊大小
            const sw = maxSourceWidth / currentScale;
            const sh = maxSourceHeight / currentScale;

            // 根據動態補間的取樣比例，決定左上角的裁切起點
            const sx = currentRx * (video.videoWidth - sw);
            const sy = currentRy * (video.videoHeight - sh);

            // 3. 繪製影像
            ctx.drawImage(video, sx, sy, sw, sh, -destW/2, -destH/2, destW, destH);

            ctx.restore();
        }
    </script>
</body>
</html>
