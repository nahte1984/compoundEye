<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>compoundEye | v3.0</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none; /* 防止移動端預設滑動行為 */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background-color: #ffffff;
            transition: opacity 0.5s ease;
        }

        #start-btn {
            font-size: 18px;
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px solid #e0e0e0;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
        }

        #error-msg {
            display: none;
            color: #ff4d4f;
            text-align: center;
            padding: 20px;
            background: #fff0f0;
            border-radius: 10px;
            max-width: 80%;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <button id="start-btn">👀</button>
        <div id="error-msg">無法取得相機權限，請確認已允許存取。</div>
    </div>

    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline muted></video>

    <script>
        const startBtn = document.getElementById('start-btn');
        const uiLayer = document.getElementById('ui-layer');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');

        // 動畫與縮放狀態
        let animProgress = 1;
        let prevState = 0;
        let targetState = 0;
        
        let prevGridScale = 1;
        let targetGridScale = 1;
        let currentGridScale = 1;

        // 基礎正三角形網格設定 (baseS 為正三角形的「邊長」)
        let baseS = 120;

        // Easing 函數 (easeInOutCubic) 讓動畫平滑
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        // 初始化 Canvas 大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 響應式：手機版三角形縮小
        baseS = window.innerWidth < 768 ? 60 : 120;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 取得每個頂點的偏移量 (嚴格遵守內角 <= 180 度，最大偏移鎖定在安全範圍內)
        function getVertexOffset(idX, idY, state, baseSize) {
            if (state === 0) return { x: 0, y: 0 };
            
            function hash(seedX, seedY, s, comp) {
                let h = Math.sin(seedX * 12.9898 + seedY * 78.233 + s * 37.719 + comp * 19.51) * 43758.5453;
                return h - Math.floor(h);
            }
            
            // 為了達到 160 度以上的極端內角反差，我們將偏移極限推升至數學上的崩潰邊緣。
            // 正三角形網格的絕對反轉極限是 高度的一半 (約 0.433 * baseSize)。
            // 設定為 0.42 可以產生極度扁平 (高達170多度) 或如細針般的三角形，
            // 同時保證畫面絕對不會破圖或反摺，維持完美的無縫接合。
            const maxOffset = baseSize * 0.42; 

            // 取一個抽象坐標系中的「引力中心」
            let focusX = hash(1, 1, state, 10) * window.innerWidth;
            let focusY = hash(1, 1, state, 11) * window.innerHeight;

            let dx = idX - focusX;
            let dy = idY - focusY;
            let dist = Math.hypot(dx, dy) + 0.001; 

            let dirX = dx / dist;
            let dirY = dy / dist;

            // 漣漪效應
            let wave = Math.cos((dist - baseSize) / (2 * baseSize) * Math.PI);

            // 加入微量雜訊
            let nx = hash(idX, idY, state, 1) * 2 - 1;
            let ny = hash(idX, idY, state, 2) * 2 - 1;

            let pushX = dirX * wave * 0.8 + nx * 0.2;
            let pushY = dirY * wave * 0.8 + ny * 0.2;

            let currentMag = Math.hypot(pushX, pushY) + 0.001;
            let scale = Math.min(currentMag, 1.0); 
            if (Math.abs(wave) > 0.5) scale = 1.0; 

            return { 
                x: (pushX / currentMag) * maxOffset * scale, 
                y: (pushY / currentMag) * maxOffset * scale 
            };
        }

        // 取得每個格子的內容屬性
        function getCellContent(col, row, state) {
            function hash(c, r, s, comp) {
                let h = Math.sin(c * 53.123 + r * 12.9898 + s * 78.233 + comp * 37.719) * 43758.5453;
                return h - Math.floor(h);
            }
            return {
                scale: 1 + hash(col, row, state, 1) * 6, // 縮放 1 ~ 7倍
                rx: hash(col, row, state, 2),          
                ry: hash(col, row, state, 3)           
            };
        }

        // 啟動相機
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } }
                });
                
                video.srcObject = stream;
                video.play();

                uiLayer.style.opacity = '0';
                setTimeout(() => { uiLayer.style.display = 'none'; }, 500);

                video.addEventListener('loadeddata', () => {
                    requestAnimationFrame(drawLoop);
                });

            } catch (err) {
                console.error("相機存取錯誤:", err);
                startBtn.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        });

        // 點擊變形與縮放
        canvas.addEventListener('click', () => {
            prevState = targetState;
            targetState++;
            
            prevGridScale = targetGridScale;
            // 面積隨機從 1 ~ 6 倍放大縮小 (長度縮放比例為 √1 ~ √6)
            let targetAreaScale = 1 + Math.random() * 5; 
            targetGridScale = Math.sqrt(targetAreaScale);

            animProgress = 0; // 重置動畫進度
        });

        // 主要繪圖迴圈
        function drawLoop() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(drawLoop);
                return;
            }

            if (animProgress < 1) {
                animProgress += 0.02; 
                if (animProgress > 1) animProgress = 1;
            }
            
            let t = easeInOutCubic(animProgress);
            currentGridScale = prevGridScale + (targetGridScale - prevGridScale) * t;

            // 三角形網格尺寸計算：
            let S_current = baseS * currentGridScale;
            // 正三角形的高 = 邊長 * (√3 / 2)
            let H_current = S_current * Math.sqrt(3) / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 計算可見的行列範圍
            // 在此網格系統中，每一欄 (col) 前進的水平距離是半個邊長 (S/2)
            const colStep = S_current * 0.5;
            const startCol = Math.floor(-S_current / colStep) - 2;
            const endCol = Math.ceil((canvas.width + S_current) / colStep) + 2;
            
            const startRow = Math.floor(-H_current / H_current) - 2;
            const endRow = Math.ceil((canvas.height + H_current) / H_current) + 2;

            // 繪製每一個可見的三角形
            for (let col = startCol; col <= endCol; col++) {
                for (let row = startRow; row <= endRow; row++) {
                    drawTriangle(col, row, t, currentGridScale, S_current, H_current);
                }
            }

            requestAnimationFrame(drawLoop);
        }

        // 繪製單個無縫正三角形
        function drawTriangle(col, row, t, currentGridScale, S_current, H_current) {
            // 利用欄與列的和，決定三角形的朝向：
            // 偶數代表「指向上方 ▲」，奇數代表「指向下方 ▼」
            const isUp = Math.abs(col + row) % 2 === 0;

            let vertices = [];
            let baseVertices = [];
            const baseH = baseS * Math.sqrt(3) / 2;

            // 計算數學上完美的無縫共用頂點
            if (isUp) {
                // ▲ 尖端朝上：頂部一點，底部兩點
                vertices = [
                    {x: col * 0.5 * S_current, y: row * H_current},
                    {x: (col + 1) * 0.5 * S_current, y: (row + 1) * H_current},
                    {x: (col - 1) * 0.5 * S_current, y: (row + 1) * H_current}
                ];
                baseVertices = [
                    {x: col * 0.5 * baseS, y: row * baseH},
                    {x: (col + 1) * 0.5 * baseS, y: (row + 1) * baseH},
                    {x: (col - 1) * 0.5 * baseS, y: (row + 1) * baseH}
                ];
            } else {
                // ▼ 尖端朝下：頂部兩點，底部一點
                vertices = [
                    {x: (col - 1) * 0.5 * S_current, y: row * H_current},
                    {x: (col + 1) * 0.5 * S_current, y: row * H_current},
                    {x: col * 0.5 * S_current, y: (row + 1) * H_current}
                ];
                baseVertices = [
                    {x: (col - 1) * 0.5 * baseS, y: row * baseH},
                    {x: (col + 1) * 0.5 * baseS, y: row * baseH},
                    {x: col * 0.5 * baseS, y: (row + 1) * baseH}
                ];
            }

            // 三角形的幾何中心點 (用於後續圖片置中與反鋸齒擴張)
            // ▲ 的重心在高度的 2/3 處，▼ 的重心在高度的 1/3 處
            const cx = col * 0.5 * S_current;
            const cy = row * H_current + (isUp ? H_current * (2/3) : H_current * (1/3));

            ctx.save();
            let maxDistX = 0;
            let maxDistY = 0;

            // 1. 繪製變形的三角形路徑
            ctx.beginPath();
            for (let i = 0; i < vertices.length; i++) {
                const idealVx = vertices[i].x;
                const idealVy = vertices[i].y;

                // 產生不隨畫面縮放改變的純淨基準點，確保網格縮放時共用頂點的 Hash 一致
                const baseIdealVx = baseVertices[i].x;
                const baseIdealVy = baseVertices[i].y;
                const idX = Math.round(baseIdealVx);
                const idY = Math.round(baseIdealVy);

                // 取得前後狀態的頂點偏移量並進行 Interpolation (補間)
                const prevOff = getVertexOffset(idX, idY, prevState, baseS);
                const targetOff = getVertexOffset(idX, idY, targetState, baseS);
                const baseOffX = prevOff.x + (targetOff.x - prevOff.x) * t;
                const baseOffY = prevOff.y + (targetOff.y - prevOff.y) * t;

                // 將偏移量套用整體的畫面縮放倍率
                const currentOffX = baseOffX * currentGridScale;
                const currentOffY = baseOffY * currentGridScale;

                let vx = idealVx + currentOffX;
                let vy = idealVy + currentOffY;

                maxDistX = Math.max(maxDistX, Math.abs(vx - cx));
                maxDistY = Math.max(maxDistY, Math.abs(vy - cy));

                // 修正 sub-pixel 產生的細線：將頂點沿著法向量向外微幅擴張 (Overlap)
                let dx = vx - cx;
                let dy = vy - cy;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    vx += (dx / dist) * 1.0; 
                }

                if (i === 0) ctx.moveTo(vx, vy);
                else ctx.lineTo(vx, vy);
            }
            ctx.closePath();
            ctx.clip(); 

            // 移動畫布中心到此格
            ctx.translate(cx, cy);

            // 取得格子本身的縮放與裁切參數，進行補間
            const prevContent = getCellContent(col, row, prevState);
            const targetContent = getCellContent(col, row, targetState);
            
            const currentScale = prevContent.scale + (targetContent.scale - prevContent.scale) * t;
            const currentRx = prevContent.rx + (targetContent.rx - prevContent.rx) * t;
            const currentRy = prevContent.ry + (targetContent.ry - prevContent.ry) * t;

            // 2. 計算影片來源裁切尺寸 
            const cellW = S_current;
            const cellH = H_current;
            const destW = Math.max(cellW * 2.0, maxDistX * 2.2);
            const destH = Math.max(cellH * 2.0, maxDistY * 2.2);
            const videoRatio = destW / destH;
            
            let maxSourceWidth = video.videoWidth;
            let maxSourceHeight = maxSourceWidth / videoRatio;

            if (maxSourceHeight > video.videoHeight) {
                maxSourceHeight = video.videoHeight;
                maxSourceWidth = maxSourceHeight * videoRatio;
            }

            const sw = maxSourceWidth / currentScale;
            const sh = maxSourceHeight / currentScale;

            const sx = currentRx * (video.videoWidth - sw);
            const sy = currentRy * (video.videoHeight - sh);

            // 3. 繪製影像
            ctx.drawImage(video, sx, sy, sw, sh, -destW/2, -destH/2, destW, destH);

            ctx.restore();
        }
    </script>
</body>
</html>
